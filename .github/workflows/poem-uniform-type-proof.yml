name: Uniform poem type proof
on:
  push:
    branches: [poem-uniform-type-proof]
    paths: ['.github/workflows/poem-uniform-type-proof.yml']
permissions:
  contents: read
jobs:
  specimen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install PyMuPDF fonttools
      - name: Measure naturally narrower serif designs at eleven points
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, json, string
          from pathlib import Path
          import pymupdf as fitz
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          out = Path('type-proof'); out.mkdir()
          url = 'https://raw.githubusercontent.com/google/fonts/main/ofl/imbue/Imbue%5Bopsz,wght%5D.ttf'
          with urllib.request.urlopen(url, timeout=30) as r: data = r.read()
          path = out / 'Imbue.ttf'; path.write_bytes(data)
          print('IMBUE_SOURCE_SHA256', hashlib.sha256(data).hexdigest())
          variants=[]
          for weight in [400,450,500]:
            for opsz in [10,14,28]:
              label=f'Imbue-{weight}-{opsz}'
              target=out/(label+'.ttf')
              font=instantiateVariableFont(TTFont(path), {'wght':weight,'opsz':opsz},inplace=True)
              font.save(target);variants.append((label,target))
          text = 'A quiet evening settles over the rooftops while the last of the daylight fades behind the hills.'
          doc = fitz.open(); metrics=[]
          for name,path in variants:
            font=fitz.Font(fontfile=str(path))
            page=doc.new_page(width=612,height=396)
            page.insert_text((36,36),name,fontsize=12)
            page.insert_font(fontname='specimen',fontfile=str(path))
            for y,line in [(70,text),(96,'ABCDEFGHIJKLMNOPQRSTUVWXYZ'),(116,'abcdefghijklmnopqrstuvwxyz'),(136,string.digits+string.punctuation),(156,'‘ ’ “ ” … — – ˹ ˺')]:
              page.insert_text((36,y),line,fontsize=11,fontname='specimen')
            metrics.append({'name':name,'width_pt':font.text_length(text,fontsize=11)})
          doc.save(out/'serif-specimens.pdf',deflate=True)
          (out/'measurements.json').write_text(json.dumps(metrics,indent=2))
          print(json.dumps(metrics,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uniform-size-specimens
          retention-days: 1
          path: |
            type-proof/serif-specimens.pdf
            type-proof/measurements.json
