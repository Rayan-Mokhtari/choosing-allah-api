name: Verify poem printing deployment
on:
  push:
    branches: [poem-uniform-type-proof]
    paths: ['.github/workflows/poem-uniform-type-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm the public print service advertises dedicated Georgia poem format eleven
        run: |
          python3 -u - <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          url = 'https://choosing-allah-api.onrender.com/health'
          result = {}
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      health = json.load(response)
                  result = {'checked_at': datetime.now(timezone.utc).isoformat(),
                            'endpoint': url, 'response': health,
                            'expected_poem_format_version': 11}
                  Path('deployment-health.json').write_text(json.dumps(result, indent=2))
                  print(json.dumps(result), flush=True)
                  if health.get('status') == 'ok' and health.get('poem_format_version') == 11:
                      print('Dedicated Georgia 11pt mixed-chapter bullet-indent renderer is live.', flush=True)
                      break
              except Exception as error:
                  print(type(error).__name__ + ': ' + str(error), flush=True)
              if attempt < 9:
                  time.sleep(10)
          else:
              raise SystemExit('The mixed-chapter bullet-indent renderer was not confirmed live within this check.')
          PY
      - name: Retain the deployment verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poem-deployment-verification
          retention-days: 1
          path: deployment-health.json
          if-no-files-found: error
